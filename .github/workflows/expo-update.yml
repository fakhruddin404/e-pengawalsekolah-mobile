name: EAS Update
on:
  push:
    branches:
      - main # Change this if your main branch is named 'master'

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x # Use your project's Node version

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish Android Update
        run: eas update --branch preview --platform android --message "Automated GitHub Update" --non-interactive

      - name: Publish iOS Update
        run: eas update --branch preview --platform ios --message "Automated GitHub Update" --non-interactive